<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Kanghary77</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: rgba(135, 206, 235, 0.7);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        /* Ukuran dan posisi teks "kanghary77" di kiri */
        h1 {
            margin: 0;
            font-size: 1.5em; 
            color: #333;
        }
        p {
            margin: 0;
            font-size: 1em;
            color: #444;
        }
        .menu-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .menu-item {
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }
        .menu-item:hover {
            transform: translateY(-5px);
            background-color: rgba(135, 206, 235, 1);
            color: #000;
        }
    </style>
</head>
<body>

</html>
